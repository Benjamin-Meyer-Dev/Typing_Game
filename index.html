<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity Web Player | TypingGame</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #231F20;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/TypingGame.loader.js"></script>
    <script>
    createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/TypingGame.data",
        frameworkUrl: "Build/TypingGame.framework.js",
        codeUrl: "Build/TypingGame.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "TypingGame",
        productVersion: "1.0",
    }).then((unityInstance) => {
    }).catch((message) => {
        alert(message);
    });
    </script>
    <script>
      window.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace') {
          e.preventDefault();
        }
      }, true);
    </script>
  </body>
</html>
